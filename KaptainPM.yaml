apiVersion: kaptain.org/1.37
kind: kubernetes-run-environment
spec:
  global:
    projectName:
      stripRepositoryNamePrefix: test
  contents:
    - kubernetes-app-manifests-only:[1.0,2.0)
    # Vendor bundle carries cluster-scoped resources (CRDs, ClusterRoles) so
    # this env has real cluster-scoped content to bubble up to the RP parent.
    - kubernetes-bundle-vendor-helm-rendered:[1.0.3,2.0)
  main:
    environment:
      deployMode: deployment
      imageAutoUpdateProvider: keel
      # Not in the draft schema yet: cluster-scoped resources are packaged
      # into the separate on-behalf dir for the RP parent to apply
      # (namespace-only role).
      clusterScopedDelegation: parent
      # Mixed source model: Secret supplied as a template in src/environment,
      # ConfigMap generated by the build.
      generateIdealEnvironmentDeployManifests: true
      checksumSecretsTiming: build
      failOnUnreferencedConfigOrSecrets: true
      # The other posture: no marker is emitted, so a run-platform
      # applies this deployer set like any other resource.
      imageDeployManifestsApplyMode: enforce-state-normally
      # Coverage: policy dryrun; both labelSelector forms (single label and
      # multi-label AND); accumulating types age / count / all.
      cleanUp:
        policy: dryrun
        additionalResources:
          # Was expectedUndeclaredResources; the matcher is flat now, so
          # metadata.name became name.
          - kind: ConfigMap
            name: kube-root-ca.crt
          - kind: Pod
            labelSelector:
              matchLabels:
                app.kubernetes.io/managed-by: envoy-gateway
          - kind: Secret
            labelSelector:
              matchLabels:
                app.kubernetes.io/managed-by: cert-manager
                app.kubernetes.io/component: webhook
        accumulatingResources:
          jobs:
            type: age
            age: 7d
          configmaps:
            type: count
            count: 3
          secrets:
            type: all
    hooks:
      preBuild: test-hooks/pre-build.bash
      preTaggingTests: test-hooks/pre-tagging-tests.bash
      postVersionsAndNaming: test-hooks/post-versions-and-naming.bash
      preDockerPrepare: test-hooks/pre-docker-prepare.bash
      postDockerTests: test-hooks/post-docker-tests.bash
      prePackagePrepare: test-hooks/pre-package-prepare.bash
      postPackageTests: test-hooks/post-package-tests.bash
      postBuild: test-hooks/post-build.bash
